<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7E3BE"/>
      <stop offset="55%" stop-color="#F1C78C"/>
      <stop offset="100%" stop-color="#D99B5E"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C88F56"/>
      <stop offset="45%" stop-color="#6F5943"/>
      <stop offset="100%" stop-color="#2B2118"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6E472B"/>
      <stop offset="100%" stop-color="#3B2314"/>
